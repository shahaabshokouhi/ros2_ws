# Nav2 for one JetRacer (front-wheel steering), started by
#   ./run_slam3.sh --nav        (orb_slam3.launch.py nav:=true)
# __AGENT__ and __BT_XML__ are filled in by the launch file. Nodes run in the
# robot's namespace but use the global /tf.
#
# Car: wheelbase 0.145 m, steering limit 0.6 rad -> minimum turning radius
# 0.145 / tan(0.6) = 0.21 m; may reverse. base_footprint is the rear axle on
# the floor (3 cm from the rear end); the car is 0.24 x 0.17 m, so its outline
# runs from 0.03 m behind to 0.21 m ahead of the axle. Max speed 0.3 m/s.
# Frames: map_nav (SLAM, level) -> odom -> base_footprint. With --nav (pose
# source slam) map_nav -> odom is the identity and odom -> base_footprint is
# the SLAM pose, so the controller's position feedback is SLAM; with
# --nav-wheels odom -> base_footprint is the wheel odometry and SLAM corrects
# map_nav -> odom. The wheel odometry (/<agent>/odom) always gives the speed.
#
# Tuned in simulation (bicycle model with these dimensions, the grid recorded
# on the robot, a 1 m scan): the planner uses a 0.35 m radius although the car
# can do 0.21 m, because pure pursuit asks for sharper turns than the path
# has; with 0.22 m it saturated the steering and drifted off tight manoeuvres.
# If tracking tight manoeuvres matters more, MPPI (Ackermann motion model)
# respects the true radius, at a higher CPU cost.

/__AGENT__/bt_navigator:
  ros__parameters:
    global_frame: map_nav
    robot_base_frame: base_footprint
    odom_topic: /__AGENT__/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 0.5
    default_nav_to_pose_bt_xml: __BT_XML__
    default_nav_through_poses_bt_xml: __BT_XML_POSES__
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

/__AGENT__/bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

/__AGENT__/bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

/__AGENT__/planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Hybrid-A*: searches x, y AND heading with car motions only, so every
      # path respects the turning radius; Reeds-Shepp allows reversing
      # (three-point turns). Plans through unknown space: with a 1 m sensor
      # range most of the map is unknown, and it replans as it sees more.
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      motion_model_for_search: "REEDS_SHEPP"
      minimum_turning_radius: 0.35          # the car can do 0.21 m; the margin lets the controller keep up
      angle_quantization_bins: 72
      allow_unknown: true
      tolerance: 0.10                       # how far from the goal the path may end if the exact pose is unreachable
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 1.5
      reverse_penalty: 2.0                  # prefer driving forward
      change_penalty: 0.5                   # discourage needless direction changes
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 5.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

/__AGENT__/controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.6               # a car cannot fine-tune its heading in place
    FollowPath:
      # Pure pursuit: steers along an arc to a point ahead on the path. No
      # turning on the spot; follows the planner's reverse segments.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 0.4
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true   # slow down near obstacles
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.08
      use_rotate_to_heading: false
      allow_reversing: true
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.0
      max_robot_pose_search_dist: 2.0

/__AGENT__/velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true                  # keep v and w in proportion: the curvature is the steering
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.5]
    min_velocity: [-0.3, 0.0, -1.5]
    max_accel: [0.6, 0.0, 3.0]
    max_decel: [-0.8, 0.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

/__AGENT__/behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

/__AGENT__/local_costmap/local_costmap:
  ros__parameters:
    update_frequency: 10.0
    publish_frequency: 5.0
    global_frame: odom
    robot_base_frame: base_footprint
    rolling_window: true
    width: 3
    height: 3
    resolution: 0.05
    footprint: "[[0.21, 0.085], [0.21, -0.085], [-0.03, -0.085], [-0.03, 0.085]]"
    footprint_padding: 0.01
    transform_tolerance: 0.5
    always_send_full_costmap: True
    plugins: ["obstacle_layer", "inflation_layer"]
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: scan
      scan:
        topic: /__AGENT__/orb_slam3/scan     # live 1 m scan from the depth camera
        data_type: "LaserScan"
        marking: True
        clearing: True
        inf_is_valid: True                  # +inf = seen free to full range
        min_obstacle_height: -1.0           # the scan lies in the floor plane (z = 0)
        max_obstacle_height: 2.0
        obstacle_max_range: 0.95            # below 1 m: Nav2 turns +inf into a point at range_max - 0.1 mm,
                                            # which would be marked as an obstacle 1 m away in every free direction
        obstacle_min_range: 0.0
        raytrace_max_range: 1.0
        raytrace_min_range: 0.0
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.25
      cost_scaling_factor: 6.0

/__AGENT__/global_costmap/global_costmap:
  ros__parameters:
    update_frequency: 2.0
    publish_frequency: 1.0
    global_frame: map_nav
    robot_base_frame: base_footprint
    resolution: 0.05
    # Unseen space counts as FREE: the robot plans straight through it from
    # the start, and replans (navigate_car.xml) as soon as the live scan or
    # the grid shows an obstacle on the path. The grid covers +-10 m around
    # the start from the beginning (grid.map_half_size), so any goal in that
    # area is plannable at once.
    track_unknown_space: false
    footprint: "[[0.21, 0.085], [0.21, -0.085], [-0.03, -0.085], [-0.03, 0.085]]"
    footprint_padding: 0.01
    transform_tolerance: 0.5
    always_send_full_costmap: True
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_topic: /__AGENT__/map               # the depth-based grid (occupancy_mapper.hpp)
      map_subscribe_transient_local: True
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: scan
      scan:
        topic: /__AGENT__/orb_slam3/scan     # live 1 m scan from the depth camera
        data_type: "LaserScan"
        marking: True
        clearing: True
        inf_is_valid: True                  # +inf = seen free to full range
        min_obstacle_height: -1.0           # the scan lies in the floor plane (z = 0)
        max_obstacle_height: 2.0
        obstacle_max_range: 0.95            # below 1 m: Nav2 turns +inf into a point at range_max - 0.1 mm,
                                            # which would be marked as an obstacle 1 m away in every free direction
        obstacle_min_range: 0.0
        raytrace_max_range: 1.0
        raytrace_min_range: 0.0
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.25
      cost_scaling_factor: 6.0

/__AGENT__/lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 4.0
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator", "velocity_smoother"]
